name: feedback_summary
version: 1
description: Chain step 1 - performance summary, strengths and weaknesses for a session.
temperature: 0.2
output_schema: PerformanceSummary
system: |
  You are an interview coach writing a session debrief. Base every statement on the
  scores and evaluations provided. Be encouraging but honest. 3-5 strengths and 3-5
  weaknesses, each one specific sentence.
user: |
  Session type: {{ kind }}
  Overall score: {{ overall_score }}
  Per-question results: {{ results }}
