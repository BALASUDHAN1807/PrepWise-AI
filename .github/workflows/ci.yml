name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # No secrets and no network LLM in CI: the rule-based mock provider + hashing embeddings keep tests deterministic.
      LLM_PROVIDER: mock
      EMBEDDING_BACKEND: hash
      VECTOR_STORE: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System packages for the code sandbox (Java + C++ are preinstalled on ubuntu-latest; verify)
        run: |
          java -version
          g++ --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m spacy download en_core_web_sm || echo "spaCy model unavailable - tests use the blank-pipeline fallback"
      - name: Lint
        run: ruff check .
      - name: Unit + API tests
        run: pytest -q
      - name: Byte-compile frontend and scripts
        run: python -m compileall -q frontend scripts backend

  notebooks:
    # Executes both notebooks end-to-end in offline SMOKE mode (tiny random model) so they cannot silently rot.
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      EMBEDDING_BACKEND: hash
      VECTOR_STORE: memory
      PREPWISE_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt torch transformers peft matplotlib --extra-index-url https://download.pytorch.org/whl/cpu
      - run: |
          for nb in notebooks/classifier_training.ipynb notebooks/finetune_lora.ipynb; do
            python - "$nb" <<'PY'
          import sys, nbformat
          from nbclient import NotebookClient
          nb = nbformat.read(sys.argv[1], as_version=4)
          for c in nb.cells:
              if c.cell_type == "code" and c.source.startswith("!pip"):
                  c.source = "pass"
          NotebookClient(nb, timeout=900, resources={"metadata": {"path": "notebooks"}}).execute()
          print("OK", sys.argv[1])
          PY
          done
