# Render Blueprint: New + -> Blueprint -> pick this repo. Set the secret values in the dashboard when prompted.
services:
  - type: web
    name: prepwise-ai
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANON_SALT
        generateValue: true
